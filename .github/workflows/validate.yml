name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-config:
    name: JavaScript syntax and JSON configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check userChrome script syntax
        run: node --check userchrome-hot-reload.uc.js
      - name: Check content actor syntax
        run: node --check hot-reload-content.sys.mjs
      - name: Run automated tests
        run: node --test tests/*.test.mjs
      - name: Validate preferences JSON
        run: python -m json.tool preferences.json > /dev/null
      - name: Validate theme JSON
        run: python -m json.tool theme.json > /dev/null
      - name: Validate distributable release archive
        run: python3 scripts/package_release.py v0.0.0 --check
      - name: Reject malformed release tags
        run: |
          if python3 scripts/package_release.py invalid --check > /dev/null 2>&1; then
            echo "Malformed release tag was accepted" >&2
            exit 1
          fi
