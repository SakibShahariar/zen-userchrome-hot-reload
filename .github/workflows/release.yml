name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build installable archive and checksums
        run: python3 scripts/package_release.py "$GITHUB_REF_NAME"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/zen-userchrome-hot-reload-$GITHUB_REF_NAME.zip" \
            dist/SHA256SUMS \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
